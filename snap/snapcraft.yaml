  setup-token:
    command: bin/setup-token
  psql:
    command: bin/psql
    plugs: [network]

parts:
  scripts:
    plugin: dump
    source: snap/local
    source-type: local
    organize:
      Caddyfile: etc/Caddyfile

  rust-toolchain:
    plugin: nil
    build-packages: [curl, ca-certificates, build-essential, clang, pkg-config, libssl-dev]
    override-build: |
      set -eux
      export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
      mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
      curl --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
        | sh -s -- -y --no-modify-path --profile minimal --default-toolchain 1.98.1 \
            --target wasm32-unknown-unknown
    prime: [-*]
    stage: [-*]

  node:
    plugin: nil
    build-packages: [xz-utils]
    source:
      - on amd64: https://nodejs.org/dist/v26.12.1/node-v26.12.1-linux-x64.tar.xz
      - on arm64: https://nodejs.org/dist/v26.12.1/node-v26.12.1-linux-arm64.tar.xz
    source-checksum:
      - on amd64: sha256/6170b2d474e1c626f43cff3adc118df9fe3b573258a4fc3d850c8dbc6b079bbd
      - on arm64: sha256/42aa04922591ee5d4dbc7740d452621acf28508239daa512f5ee8c47ee224fdb
    override-build: |
      set -eux
      node_bin="$(find "$CRAFT_PART_SRC" -type f -path '*/bin/node' | head -n1)"
      root="$(dirname "$(dirname "$node_bin")")"
      mkdir -p "$CRAFT_PART_INSTALL/opt/node"
      cp -a "$root/." "$CRAFT_PART_INSTALL/opt/node/"
    prime:
      - opt/node/bin/node

  runtime-libs:
    plugin: nil
    stage-packages:
      - bash
      - coreutils
      - curl
      - jq
      - openssl
      - util-linux
      - postgresql-18
      - valkey-server
      - ca-certificates
      - libstdc++6
      - libtinfo6
      - zlib1g
      - libssl3t64
    stage:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/locale
      - -usr/share/lintian

  nats:
    plugin: nil
    source:
      - on amd64: https://github.com/nats-io/nats-server/releases/download/v2.14.9/nats-server-v2.14.9-linux-amd64.tar.gz
      - on arm64: https://github.com/nats-io/nats-server/releases/download/v2.14.9/nats-server-v2.14.9-linux-arm64.tar.gz
    source-checksum:
      - on amd64: sha256/74f20433c5b39d7cc6db54155ec1e669671c728f625e54cf307298924b2b4259
      - on arm64: sha256/e4f437b27c5966f65efdc5c17e5e50a02daea424cd2efc71df2ca514119ee4bc
    override-build: |
      set -eux
      install -Dm755 "$(find "$CRAFT_PART_SRC" -type f -name nats-server | head -n1)" "$CRAFT_PART_INSTALL/bin/nats-server"

  livekit:
    plugin: nil
    source: https://github.com/livekit/livekit.git
    source-tag: v1.12.0
    source-depth: 1
    build-packages: [golang-go, git, ca-certificates]
    override-build: |
      set -eux
      cd "$CRAFT_PART_SRC"
      # Strict confinement denies /sys/fs/cgroup; treat EACCES like "missing"
      # so the hardware stats fall back to system-wide readings.
      proto="$(go list -m -f '{{.Dir}}' github.com/livekit/protocol)"
      rm -rf "$CRAFT_PART_BUILD/protocol"
      cp -r "$proto" "$CRAFT_PART_BUILD/protocol"
      chmod -R u+w "$CRAFT_PART_BUILD/protocol"
      sed -i 's/errors.Is(err, os.ErrNotExist):/errors.Is(err, os.ErrNotExist), errors.Is(err, os.ErrPermission):/' \
        "$CRAFT_PART_BUILD/protocol/utils/hwstats/cpu_linux.go" "$CRAFT_PART_BUILD/protocol/utils/hwstats/memory_linux.go"
      grep -q ErrPermission "$CRAFT_PART_BUILD/protocol/utils/hwstats/cpu_linux.go"
      go mod edit -replace "github.com/livekit/protocol=$CRAFT_PART_BUILD/protocol"
      CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$CRAFT_PART_INSTALL/bin/livekit-server" ./cmd/server

  seaweedfs:
    plugin: nil
    source:
      - on amd64: https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_amd64.tar.gz
      - on arm64: https://github.com/seaweedfs/seaweedfs/releases/download/4.47/linux_arm64.tar.gz
    source-checksum:
      - on amd64: sha256/31fb804858885f9e7f18b6d3b1da09e824baac3e6a55b5a62c3c4c77e6ed6d7d
      - on arm64: sha256/ba5c9def9ff98f78becdf309a50a9f906922f6383a7c4c772d01ede3cc012e16
    override-build: |
      set -eux
      install -Dm755 "$(find "$CRAFT_PART_SRC" -type f -name weed | head -n1)" "$CRAFT_PART_INSTALL/bin/weed"

  caddy:
    plugin: nil
    source:
      - on amd64: https://github.com/caddyserver/caddy/releases/download/v2.11.8/caddy_2.11.8_linux_amd64.tar.gz
      - on arm64: https://github.com/caddyserver/caddy/releases/download/v2.11.8/caddy_2.11.8_linux_arm64.tar.gz
    source-checksum:
      - on amd64: sha256/f032f8805e4df2ce5e1a8a624495c91e9ff763d8ff3ceddadd4784a07c472f40
      - on arm64: sha256/6781a68e090fecda8c563b5a3b00115e18d7134084099ae804a017622471bed1
    override-build: |
      set -eux
      install -Dm755 "$(find "$CRAFT_PART_SRC" -type f -name caddy | head -n1)" "$CRAFT_PART_INSTALL/bin/caddy"

  meilisearch:
    plugin: nil
    source:
      - on amd64: https://github.com/meilisearch/meilisearch/releases/download/v1.53.3/meilisearch-linux-amd64
      - on arm64: https://github.com/meilisearch/meilisearch/releases/download/v1.53.3/meilisearch-linux-aarch64
    source-type: file
    source-checksum:
      - on amd64: sha256/b1ffed74645730b3994afab738e4fc75111761e7069c96470d30fd1c5d80f892
      - on arm64: sha256/cf5d9bfe4352d8f87007d3207646408c8421550df526965c5a449440afdb9b5c
    override-build: |
      set -eux
      install -Dm755 "$(find "$CRAFT_PART_SRC" -type f -name 'meilisearch-linux-*' | head -n1)" "$CRAFT_PART_INSTALL/bin/meilisearch"

  fluxer-rust:
    after: [rust-toolchain, node]
    plugin: nil
    source: https://github.com/fluxerapp/fluxer.git
    source-tag: fluxer-release@2026.1104.180331
    source-depth: 1
    build-packages: [build-essential, pkg-config, libssl-dev, cmake, git, ca-certificates, curl]
    override-build: |
      set -eux
      export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
      export PATH="$CARGO_HOME/bin:$CRAFT_STAGE/opt/node/bin:$PATH"
      cd "$CRAFT_PART_SRC"
      # fluxer_admin's build script needs the tailwind CLI.
      mkdir -p /opt/tw && (cd /opt/tw && npm init -y >/dev/null && npm install --no-audit --no-fund @tailwindcss/cli@4.2.1 tailwindcss@4.2.1)
      export PATH="/opt/tw/node_modules/.bin:$PATH"
      ln -sfn /opt/tw/node_modules "$CRAFT_PART_SRC/node_modules"
      cargo build --release --locked \
        -p fluxer_admin -p fluxer_app_proxy -p fluxer-push -p fluxer-snowflakes \
        -p fluxer-gifs -p fluxer-unfurl
      cargo build --release --locked -p fluxer-users -p fluxer-messages --features scylla
      mkdir -p "$CRAFT_PART_INSTALL/opt/fluxer/bin"
      for b in fluxer_admin fluxer_app_proxy fluxer-push fluxer-snowflakes fluxer-gifs \
               fluxer-unfurl fluxer-users fluxer-messages; do
        install -m755 "target/release/$b" "$CRAFT_PART_INSTALL/opt/fluxer/bin/$b"
      done

  media-proxy:
    after: [rust-toolchain]
    plugin: nil
    source: https://github.com/fluxerapp/fluxer.git
    source-tag: fluxer-release@2026.1104.180331
    source-depth: 1
    build-packages:
      - aom-tools
      - dav1d
      - build-essential
      - pkg-config
      - cmake
      - nasm
      - yasm
      - git
      - xz-utils
      - curl
      - ca-certificates
      - zlib1g-dev
      - libde265-dev
      - libdav1d-dev
      - libaom-dev
      - libwebm-dev
      - libvips-dev
      - libwebp-dev
      - liblcms2-dev
      - libyuv-dev
      - libcurl4-openssl-dev
    stage-packages:
      - libcurl4t64
      - libvips42t64
      - libwebp7
      - libwebpmux3
      - libwebpdemux2
      - liblcms2-2
      - libyuv0
      - libde265-0
      - libdav1d7
      - libaom3
      - libjemalloc2
    override-build: |
      set -eux
      export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
      export PATH="$CARGO_HOME/bin:$PATH"
      cd "$CRAFT_PART_SRC"
      # Builds the pinned ffmpeg and libheif that the media proxy requires.
      native=/opt/fluxer-native
      mkdir -p "$native"
      bash fluxer_media_proxy/tools/install-native-deps.sh "$native"
      rm -f /usr/lib/*/libheif.so.1*
      export PKG_CONFIG_PATH="$native/lib/pkgconfig:$native/lib64/pkgconfig"
      export LD_LIBRARY_PATH="$native/lib:$native/lib64"
      export RUSTFLAGS="-L native=$native/lib -L native=$native/lib64"
      cargo build --release --locked -p fluxer-media-proxy
      install -Dm755 target/release/fluxer-media-proxy "$CRAFT_PART_INSTALL/opt/fluxer/bin/fluxer-media-proxy"
      mkdir -p "$CRAFT_PART_INSTALL/opt/native/lib"
      cp -a "$native"/lib/*.so.* "$CRAFT_PART_INSTALL/opt/native/lib/"
      if [ -d "$native/lib64" ]; then cp -a "$native"/lib64/*.so.* "$CRAFT_PART_INSTALL/opt/native/lib/" || true; fi
    stage:
      - -usr/lib/*/libheif.so*
      - -usr/share/doc

  fluxer-api:
    after: [node]
    plugin: nil
    source: https://github.com/fluxerapp/fluxer.git
    source-tag: fluxer-release@2026.1104.180331
    source-depth: 1
    build-packages: [build-essential, gcc, libssl-dev, pkg-config, openssl, python3, git, ca-certificates]
    override-build: |
      set -eux
      export PATH="$CRAFT_STAGE/opt/node/bin:$PATH"
      npm install -g --prefix "$CRAFT_PART_BUILD/.tools" pnpm@11.27.0
      export PATH="$CRAFT_PART_BUILD/.tools/bin:$PATH"
      cd "$CRAFT_PART_SRC"
      pnpm install --frozen-lockfile
      pnpm --filter fluxer_api run build
      out="$CRAFT_PART_INSTALL/opt/fluxer"
      mkdir -p "$out"
      pnpm deploy --legacy --filter=fluxer_api --prod --config.allow-unused-patches=true "$out/fluxer_api"
      rm -rf "$out/fluxer_api/pkgs" "$out/fluxer_api/dist"
      cp -a fluxer_api/dist "$out/fluxer_api/dist"
      cp -a fluxer_api/bin "$out/fluxer_api/bin"
      cp -a tsconfigs "$out/tsconfigs"

  fluxer-app:
    after: [node, rust-toolchain]
    plugin: nil
    source: https://github.com/fluxerapp/fluxer.git
    source-tag: fluxer-release@2026.1104.180331
    source-depth: 1
    build-packages: [build-essential, clang, curl, ca-certificates, git, brotli, findutils]
    override-build: |
      set -eux
      export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
      export PATH="$CARGO_HOME/bin:$CRAFT_STAGE/opt/node/bin:$PATH"
      npm install -g --prefix "$CRAFT_PART_BUILD/.tools" pnpm@11.27.0
      export PATH="$CRAFT_PART_BUILD/.tools/bin:$PATH"
      cd "$CRAFT_PART_SRC"
      pnpm install --frozen-lockfile --filter 'fluxer_app...'
      export BUILD_VERSION="$CRAFT_PROJECT_VERSION" PUBLIC_ASSET_BASE_URL=""
      (cd fluxer_app && pnpm build)
      dest="$CRAFT_PART_INSTALL/opt/fluxer/app-proxy/static"
      mkdir -p "$dest"
      cp -a fluxer_app/dist/. "$dest/"
      sh fluxer_app_proxy/scripts/precompress_assets.sh "$dest"

  fluxer-static:
    plugin: nil
    source: https://github.com/fluxerapp/fluxer.git
    source-tag: fluxer-release@2026.1104.180331
    source-depth: 1
    build-packages: [curl, ca-certificates]
    override-build: |
      set -eux
      cd "$CRAFT_PART_SRC/fluxer_static"
      dest="$CRAFT_PART_INSTALL/opt/fluxer/static"
      mkdir -p "$dest"
      cp -a LICENSE THIRD_PARTY_LICENSES.md avatars badges desktop emoji web "$dest/"
      sh fetch-spellcheck-dictionaries.sh "$dest/desktop/spellcheck/dictionaries"

  fluxer-gateway:
    after: [rust-toolchain]
    plugin: nil
    source: https://github.com/fluxerapp/fluxer.git
    source-tag: fluxer-release@2026.1104.180331
    source-depth: 1
    build-packages: [erlang, git, curl, make, gcc, g++, libc6-dev, ca-certificates]
    override-build: |
      set -eux
      export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
      export PATH="$CARGO_HOME/bin:$PATH"
      curl --retry 5 --retry-all-errors -fsSL \
        https://github.com/erlang/rebar3/releases/download/3.27.3/rebar3 -o "$CRAFT_PART_BUILD/rebar3"
      chmod +x "$CRAFT_PART_BUILD/rebar3"
      cd "$CRAFT_PART_SRC/fluxer_gateway"
      "$CRAFT_PART_BUILD/rebar3" compile --deps_only
      cp config/sys.config.template config/sys.config
      "$CRAFT_PART_BUILD/rebar3" as prod release
      mkdir -p "$CRAFT_PART_INSTALL/opt"
      cp -a _build/prod/rel/fluxer_gateway "$CRAFT_PART_INSTALL/opt/fluxer_gateway"
