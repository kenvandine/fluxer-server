name: fluxer-server
title: Fluxer Server
base: core26
version: "2026.1104.180331"
summary: Self-hosted Fluxer chat and voice server
description: |
  Fluxer is a free and open source instant messaging and VoIP chat platform
  for friends, groups and communities. This snap runs a complete, self-hosted
  Fluxer instance (https://fluxer.com/selfhost) natively: the Fluxer API,
  gateway, media proxy and web app, plus PostgreSQL, Valkey, NATS,
  Meilisearch, SeaweedFS (S3 storage), LiveKit (voice) and Caddy (TLS).
  No Docker is needed.

  Setup:

    sudo snap set fluxer-server domain=chat.example.com

  Setting the domain enables and starts every service. Then run
  `sudo fluxer-server.setup-token` and open https://chat.example.com to
  create the admin account.

  The domain needs an A record pointing at this machine. Open TCP 80, 443,
  7881 and UDP 443, 7882 in any firewall. To run behind your own reverse
  proxy instead, also set `behind-proxy=127.0.0.1:8080` and point the proxy
  at that address.

  Other settings: http-port, https-port, tls (a Caddy tls directive such as
  "internal"), livekit-node-ip, and env.<NAME>=<value> for any Fluxer
  environment variable, for example
  `snap set fluxer-server env.FLUXER_EMAIL_ENABLED=true`.
license: AGPL-3.0-or-later
grade: devel
confinement: strict
assumes: [snapd2.61]

platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

