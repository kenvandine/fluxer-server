    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service valkey
  nats:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service nats
  meilisearch:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service meilisearch
  seaweedfs:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
