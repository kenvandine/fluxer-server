    command: bin/service users
  gifs:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service gifs
  messages:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service messages
  unfurl:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service unfurl
  api:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service api
  worker:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service worker
  gateway:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service gateway
  media-proxy:
    daemon: simple
