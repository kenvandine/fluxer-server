    command: bin/service seaweedfs
  livekit:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service livekit
  snowflakes:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
    plugs: [network, network-bind]
    command: bin/service snowflakes
  users:
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 5s
    stop-timeout: 60s
